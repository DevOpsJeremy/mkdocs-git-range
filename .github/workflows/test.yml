on:
  push:
    branches: ["*"]
jobs:
  checkout:
    runs-on: [ubuntu-latest]
    container: squidfunk/mkdocs-material
    steps:
      - uses: actions/checkout@v4
        with:
          set-safe-directory: true
        #  repository: DevOpsJeremy/DevOpsJeremy.github.io
        #if: "'a' == 'b'"
      - run: pip install . # mkdocs-git-range
      - run: git config --global --verbose safe.directory
      - run: git rev-parse --show-toplevel
      - name: Build
        run: mkdocs build